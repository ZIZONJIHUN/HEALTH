name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 푸시하면 앞 실행을 취소한다. 어차피 볼 것은 마지막 결과다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 린트
        run: npm run lint -- --max-warnings 0

      - name: 타입 검사
        run: npx tsc --noEmit

      - name: 단위 테스트
        run: npm test

      # E2E 는 자체 모의 YouTube 서버를 띄운다. API 키도 네트워크도 필요 없다.
      # (playwright.config.ts 가 YOUTUBE_API_BASE 를 모의 서버로 덮어쓴다.)
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
